upstream api {
    server api:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # SSE requires buffering off and persistent connection
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
